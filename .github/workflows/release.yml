name: Release from tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v3.13.0)'
        required: false
        default: 'v3.13.0'
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        env:
          GPR_USER: ${{ secrets.GPR_USER || github.repository_owner }}
          GPR_KEY: ${{ secrets.GPR_KEY || secrets.MORPHE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ secrets.GPR_USER || github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GPR_KEY || secrets.MORPHE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid generatePatchesList -Pgpr.user="${{ secrets.GPR_USER || github.repository_owner }}" -Pgpr.key="${{ secrets.GPR_KEY || secrets.MORPHE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}"

      - name: Validate synced release metadata
        id: metadata
        shell: pwsh
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          $inputTag = "${{ github.event.inputs.tag }}"
          $tag = if (-not [string]::IsNullOrWhiteSpace($inputTag)) { $inputTag } else { $env:GITHUB_REF_NAME }
          if (-not $tag.StartsWith("v")) {
              throw "Release tag must start with 'v'."
          }

          $expectedVersion = $tag.Substring(1)
          $gradleText = Get-Content -LiteralPath "gradle.properties" -Raw
          $match = [regex]::Match($gradleText, '(?m)^\s*version\s*=\s*([^\r\n#]+?)\s*$')
          if (-not $match.Success) {
              throw "Unable to resolve version from gradle.properties."
          }

          $actualVersion = $match.Groups[1].Value.Trim()
          if ($actualVersion -ne $expectedVersion) {
              throw "Tag version '$expectedVersion' does not match gradle.properties version '$actualVersion'."
          }

          $bundle = Get-Content -LiteralPath "patches-bundle.json" -Raw | ConvertFrom-Json
          if ([string]$bundle.version -ne $actualVersion) {
              throw "patches-bundle.json version '$($bundle.version)' does not match '$actualVersion'."
          }

          $expectedDownloadUrl = "https://github.com/$($env:REPO_SLUG)/releases/download/$tag/patches-$actualVersion.mpp"

          if ([string]$bundle.download_url -ne $expectedDownloadUrl) {
              throw "patches-bundle.json download_url does not match expected public release URL."
          }
          if (-not [string]::IsNullOrEmpty([string]$bundle.signature_download_url)) {
              throw "patches-bundle.json signature_download_url must be empty for the public repo."
          }

          "version=$actualVersion" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Prepare release notes
        shell: pwsh
        run: |
          $bundle = Get-Content -LiteralPath "patches-bundle.json" -Raw | ConvertFrom-Json
          $notes = [string]$bundle.description
          if ([string]::IsNullOrWhiteSpace($notes)) {
              $notes = "Public release for ${{ steps.metadata.outputs.release_tag }}."
          }
          Set-Content -LiteralPath "release-notes.md" -Value $notes -Encoding utf8

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          body_path: release-notes.md
          prerelease: ${{ contains(steps.metadata.outputs.release_tag, '-dev.') }}
          files: |
            patches/build/libs/patches-${{ steps.metadata.outputs.version }}.mpp
